name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # enableGitInfo reads each page's last commit.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo Extended
        run: |
          f="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "$base/$f"
          curl -fsSL "$base/hugo_${HUGO_VERSION}_checksums.txt" | grep " $f\$" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$f" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "::error::Set the SITE_URL repository variable"; exit 1; }
          hugo build --baseURL "$SITE_URL" --cleanDestinationDir --printPathWarnings --printI18nWarnings
          PYTHONDONTWRITEBYTECODE=1 python3 bin/check-rendered-links.py --all --origin "${SITE_URL%/}"

      # Direct uploads do not count against the Pages build quota.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=ddia --branch=main
